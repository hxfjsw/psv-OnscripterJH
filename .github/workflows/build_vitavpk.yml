name: build vita vpk

on:
  push:
    branches: [master]
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-24.04
    env:
      VITASDK: ${{ github.workspace }}/.vitasdk
    steps:
      - uses: actions/checkout@v6
      - name: Cache VitaSDK
        id: vitasdk
        uses: actions/cache@v5
        with:
          path: ${{ env.VITASDK }}
          key: vitasdk-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('script/install_vitasdk.sh') }}
      - name: Install VitaSDK
        if: steps.vitasdk.outputs.cache-hit != 'true'
        run: bash script/install_vitasdk.sh
      - name: Build and check VPK
        run: |
          sh script/build_vitavpk.sh vpk
          unzip -t build/VitaOns.vpk
      - name: Upload VPK
        uses: actions/upload-artifact@v7
        with:
          name: VitaOns
          path: build/VitaOns.vpk
          if-no-files-found: error

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v8
        with:
          name: VitaOns
      - uses: ncipollo/release-action@v1
        with:
          artifacts: VitaOns.vpk
          allowUpdates: true
          artifactErrorsFailBuild: true
